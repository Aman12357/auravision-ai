apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-backend-config
  namespace: aura-production
data:
  SPRING_PROFILES_ACTIVE: "production"
  SERVER_PORT: "8080"
  LOG_LEVEL: "INFO"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-headless:9092"
  CORS_ALLOWED_ORIGINS: "https://app.aura.ai"
  FRONTEND_URL: "https://app.aura.ai"
  STORAGE_TYPE: "s3"
