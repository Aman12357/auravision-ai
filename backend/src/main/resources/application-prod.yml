spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aura_db}?sslmode=require
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

logging:
  level:
    com.aura: INFO
    org.springframework.security: WARN

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
