spring:
  datasource:
    url: jdbc:h2:mem:auradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    com.aura: DEBUG
    org.springframework.security: INFO
