spring:
  main:
    allow-circular-references: true
  application:
    name: aura-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aura_db}
    username: ${DB_USERNAME:aura}
    password: ${DB_PASSWORD:aura_secret}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: aura-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret}
            scope: user:email
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:mail}
    password: ${MAIL_PASSWORD:pass}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWF1cmEtdmlkZW8tYWktZW50ZXJwcmlzZS1wbGF0Zm9ybS1zZWN1cmU=}
    access-token-expiry: 900000 # 15 minutes
    refresh-token-expiry: 604800000 # 7 days
  security:
    jwt:
      secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWF1cmEtdmlkZW8tYWktZW50ZXJwcmlzZS1wbGF0Zm9ybS1zZWN1cmU=}
      expiration-ms: 900000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  otp:
    expiry-minutes: 10
    length: 6
  2fa:
    issuer: AuraVision AI
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      directory: ${LOCAL_STORAGE_DIR:C:/Users/ay670/.gemini/antigravity/scratch/aura-video-ai/storage}
    s3:
      bucket: ${AWS_S3_BUCKET:aura-videos}
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY:default}
      secret-key: ${AWS_SECRET_KEY:default}
      cdn-url: ${CDN_URL:https://cdn.auravideo.ai}
    r2:
      account-id: ${CF_ACCOUNT_ID:default}
      access-key: ${CF_R2_ACCESS_KEY:default}
      secret-key: ${CF_R2_SECRET_KEY:default}
      bucket: ${CF_R2_BUCKET:default}
  ai:
    local:
      offline-mode: true
      llm-url: ${LOCAL_LLM_URL:http://localhost:11434}
      llm-model: ${LOCAL_LLM_MODEL:llama3.2}
      video-engine-url: ${LOCAL_VIDEO_ENGINE_URL:http://localhost:8000}
      gpu-device: ${GPU_DEVICE:cuda:0}
      model-directory: ${MODEL_DIRECTORY:C:/Users/ay670/.gemini/antigravity/scratch/aura-video-ai/models}
    openai:
      api-key: ${OPENAI_API_KEY:AQ.Ab8RN6J7SjQqZj22PxdDf8Ul5WizgFzn544_8dutV17xRmqdxA}
      model: ${OPENAI_MODEL:gpt-4o}
    replicate:
      api-token: ${REPLICATE_API_TOKEN:AQ.Ab8RN6J7SjQqZj22PxdDf8Ul5WizgFzn544_8dutV17xRmqdxA}
    fal:
      api-key: ${FAL_API_KEY:AQ.Ab8RN6J7SjQqZj22PxdDf8Ul5WizgFzn544_8dutV17xRmqdxA}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.aura: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: never
    include-stacktrace: never

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_mock}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_mock}
  key-secret: ${RAZORPAY_KEY_SECRET:rzp_secret_mock}

paypal:
  client-id: ${PAYPAL_CLIENT_ID:paypal_client_mock}
  client-secret: ${PAYPAL_CLIENT_SECRET:paypal_secret_mock}
  mode: ${PAYPAL_MODE:sandbox}

rate-limit:
  auth:
    login: 10
    register: 5
  api:
    jobs: 30
    enhance-prompt: 20
  global: 300
